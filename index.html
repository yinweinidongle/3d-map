<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D China Map Globe</title>
    <style>
      body {
        margin: 0;
        background: radial-gradient(circle at top, #020b1a, #01030a 60%, #000000 100%);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #e6f1ff;
      }

      #app {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }

      canvas {
        display: block;
      }

      .loading {
        font-size: 1rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #4da8ff;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <span class="loading">Loading 3D Globe…</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
